<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리반 학급 게시판</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

    <!-- 상단 네비게이션바 (기존 디자인 레이아웃) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="/"><i class="fa-solid fa-chalkboard-user me-2"></i>우리반 학급 게시판</a>
            
            <div class="d-flex align-items-center">
                <span id="userInfo" class="text-white me-3 fw-semibold"></span>
                
                <!-- 우측 상단 교사 회원가입 버튼 -->
                <button type="button" class="btn btn-outline-light btn-sm me-2" data-bs-toggle="modal" data-bs-target="#teacherRegisterModal">
                    <i class="fa-solid fa-user-plus me-1"></i>교사 회원가입
                </button>
                
                <button id="teacherLoginBtn" class="btn btn-warning btn-sm" data-bs-toggle="modal" data-bs-target="#teacherLoginModal">
                    <i class="fa-solid fa-right-to-bracket me-1"></i>교사 로그인
                </button>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- 글 작성 카드 -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-white fw-bold">
                <i class="fa-solid fa-pen-to-square me-2"></i>새 포스트잇 작성하기
            </div>
            <div class="card-body">
                <form id="postForm">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">모둠/구분</label>
                            <select id="postSection" class="form-select">
                                <option value="모둠 1">모둠 1</option>
                                <option value="모둠 2">모둠 2</option>
                                <option value="모둠 3">모둠 3</option>
                                <option value="모둠 4">모둠 4</option>
                            </select>
                        </div>
                        <div class="col-md-8">
                            <label class="form-label fw-semibold">제목</label>
                            <input type="text" id="postTitle" class="form-control" placeholder="제목을 입력하세요">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">내용</label>
                            <textarea id="postContent" class="form-control" rows="3" placeholder="내용을 입력하세요..." required></textarea>
                        </div>
                        <div class="col-12">
                            <label class="btn btn-outline-secondary btn-sm mb-0">
                                <i class="fa-solid fa-folder-open me-1"></i>사진/파일 업로드
                                <input type="file" id="fileInput" multiple hidden onchange="uploadFile(this)">
                            </label>
                            <span id="uploadStatus" class="ms-2 text-muted small"></span>
                        </div>
                        <div class="col-12 text-end">
                            <button type="button" class="btn btn-primary px-4" onclick="alert('게시물이 등록되었습니다!')">
                                <i class="fa-solid fa-paper-plane me-1"></i>등록하기
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 교사 회원가입 모달 -->
    <div class="modal fade" id="teacherRegisterModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title"><i class="fa-solid fa-user-plus me-2"></i>교사 회원가입</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">아이디</label>
                        <input type="text" class="form-control" placeholder="교사 아이디">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">비밀번호</label>
                        <input type="password" class="form-control" placeholder="비밀번호">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-primary" onclick="alert('회원가입 기능이 완료되었습니다.');">가입하기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 교사 로그인 모달 -->
    <div class="modal fade" id="teacherLoginModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-warning">
                    <h5 class="modal-title"><i class="fa-solid fa-right-to-bracket me-2"></i>교사 로그인</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">아이디</label>
                        <input type="text" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">비밀번호</label>
                        <input type="password" class="form-control">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-warning">로그인</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function uploadFile(input) {
            const status = document.getElementById('uploadStatus');
            if(input.files.length > 0) {
                const formData = new FormData();
                for(let file of input.files) {
                    formData.append('files', file);
                }
                status.innerText = "업로드 중...";
                fetch('/upload', { method: 'POST', body: formData })
                .then(res => res.json())
                .then(data => {
                    status.innerText = "업로드 완료!";
                })
                .catch(err => {
                    status.innerText = "업로드 실패";
                });
            }
        }
    </script>
</body>
</html>
