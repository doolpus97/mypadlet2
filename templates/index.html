<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리반 학급 게시판</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-light">

    <!-- 상단 네비게이션바 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="/"><i class="fa-solid fa-chalkboard-user me-2"></i>우리반 학급 게시판</a>
            
            <div class="d-flex align-items-center">
                <!-- 사용자 정보 표시 영역 -->
                <span id="userInfo" class="text-white me-3 fw-semibold"></span>
                
                <!-- 교사 회원가입 버튼 (우측 상단) -->
                <button type="button" class="btn btn-outline-light btn-sm me-2" data-bs-toggle="modal" data-bs-target="#teacherRegisterModal">
                    <i class="fa-solid fa-user-plus me-1"></i>교사 회원가입
                </button>
                
                <!-- 교사 로그인 / 로그아웃 버튼 -->
                <button id="teacherLoginBtn" class="btn btn-warning btn-sm me-2" data-bs-toggle="modal" data-bs-target="#teacherLoginModal">
                    <i class="fa-solid fa-right-to-bracket me-1"></i>교사 로그인
                </button>
                <button id="logoutBtn" class="btn btn-danger btn-sm d-none" onclick="logout()">
                    <i class="fa-solid fa-right-from-bracket me-1"></i>로그아웃
                </button>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- 보드 선택 영역 -->
        <div class="card shadow-sm mb-4">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center gap-2">
                    <label for="boardSelect" class="fw-bold text-nowrap">게시판 선택:</label>
                    <select id="boardSelect" class="form-select" style="min-width: 200px;" onchange="loadPosts()">
                        <!-- 동적으로 로드됨 -->
                    </select>
                </div>
                <div id="teacherBoardControls" class="d-none">
                    <button class="btn btn-sm btn-success" onclick="createBoard()"><i class="fa-solid fa-plus me-1"></i>새 게시판 만들기</button>
                </div>
            </div>
        </div>

        <!-- 글 작성 카드 -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-white fw-bold">
                <i class="fa-solid fa-pen-to-square me-2"></i>새 포스트잇 작성하기
            </div>
            <div class="card-body">
                <form id="postForm">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">게시할 모둠/구분</label>
                            <select id="postSection" class="form-select" required>
                                <option value="모둠 1">모둠 1</option>
                                <option value="모둠 2">모둠 2</option>
                                <option value="모둠 3">모둠 3</option>
                                <option value="모둠 4">모둠 4</option>
                                <option value="모둠 5">모둠 5</option>
                                <option value="모둠 6">모둠 6</option>
                            </select>
                        </div>
                        <div class="col-md-8">
                            <label class="form-label fw-semibold">제목 (선택)</label>
                            <input type="text" id="postTitle" class="form-control" placeholder="제목을 입력하세요">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">내용</label>
                            <textarea id="postContent" class="form-control" rows="3" placeholder="포스트잇 내용을 입력하세요..." required></textarea>
                        </div>
                        
                        <!-- 파일 업로드 / 모바일 카메라 첨부 -->
                        <div class="col-12">
                            <div class="d-flex flex-wrap gap-2 align-items-center">
                                <label class="btn btn-outline-secondary btn-sm mb-0">
                                    <i class="fa-solid fa-folder-open me-1"></i>사진/파일 업로드
                                    <input type="file" id="fileInput" multiple hidden onchange="handleFileUpload(this)">
                                </label>
                                <label class="btn btn-outline-info btn-sm mb-0">
                                    <i class="fa-solid fa-camera me-1"></i>사진 촬영
                                    <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden onchange="handleFileUpload(this)">
                                </label>
                                <span id="uploadStatus" class="text-muted small"></span>
                            </div>
                            <!-- 업로드된 첨부파일 미리보기 구역 -->
                            <div id="attachmentPreview" class="d-flex flex-wrap gap-2 mt-2"></div>
                        </div>

                        <div class="col-12 text-end">
                            <button type="button" class="btn btn-primary px-4" onclick="submitPost()">
                                <i class="fa-solid fa-paper-plane me-1"></i>등록하기
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- 게시물 표시 구역 (패들렛 보드) -->
        <div id="boardContainer" class="row g-4">
            <!-- 동적으로 포스트잇이 등록됩니다 -->
        </div>
    </div>

    <!-- 1. 교사 회원가입 모달 -->
    <div class="modal fade" id="teacherRegisterModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title"><i class="fa-solid fa-user-plus me-2"></i>교사 회원가입</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="teacherRegisterForm">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">아이디</label>
                            <input type="text" id="regTeacherId" class="form-control" required placeholder="교사 아이디">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">비밀번호</label>
                            <input type="password" id="regTeacherPw" class="form-control" required placeholder="비밀번호">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">이름</label>
                            <input type="text" id="regTeacherName" class="form-control" required placeholder="선생님 이름">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-primary" onclick="registerTeacher()">회원가입 완료</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. 교사 로그인 모달 -->
    <div class="modal fade" id="teacherLoginModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-warning">
                    <h5 class="modal-title"><i class="fa-solid fa-right-to-bracket me-2"></i>교사 로그인</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="teacherLoginForm">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">아이디</label>
                            <input type="text" id="loginTeacherId" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">비밀번호</label>
                            <input type="password" id="loginTeacherPw" class="form-control" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-warning" onclick="loginTeacher()">로그인</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JS 스크립트 -->
    <script href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
