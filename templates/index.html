<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리반 학급 게시판</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .login-card { max-width: 400px; width: 100%; border-radius: 15px; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

    <!-- 1. 로그인 / 입장 화면 -->
    <div id="loginSection" class="card shadow-sm border-0 login-card p-4">
        <h3 class="text-center fw-bold mb-4">우리반 학급 게시판</h3>

        <ul class="nav nav-tabs nav-justified mb-3" id="loginTab">
            <li class="nav-item">
                <button class="nav-link active fw-bold" id="student-tab" data-bs-toggle="tab" data-bs-target="#student">학생 입장</button>
            </li>
            <li class="nav-item">
                <button class="nav-link fw-bold" id="teacher-tab" data-bs-toggle="tab" data-bs-target="#teacher">교사 로그인</button>
            </li>
            <li class="nav-item">
                <button class="nav-link fw-bold text-primary" id="register-tab" data-bs-toggle="tab" data-bs-target="#register">교사 가입</button>
            </li>
        </ul>

        <div class="tab-content" id="loginTabContent">
            <!-- 학생 입장 -->
            <div class="tab-pane fade show active" id="student">
                <form onsubmit="return handleStudentLogin(event)">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">4자리 입장 코드</label>
                        <input type="text" id="entryCode" class="form-control text-center" placeholder="••••" maxlength="4" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">학생 이름</label>
                        <input type="text" id="studentName" class="form-control" placeholder="홍길동" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold">게시판 입장하기</button>
                </form>
            </div>

            <!-- 교사 로그인 -->
            <div class="tab-pane fade" id="teacher">
                <form onsubmit="return handleTeacherLogin(event)">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">교사 아이디</label>
                        <input type="text" id="teacherId" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">비밀번호</label>
                        <input type="password" id="teacherPw" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-warning w-100 fw-bold">교사 로그인</button>
                </form>
            </div>

            <!-- 교사 가입 -->
            <div class="tab-pane fade" id="register">
                <form onsubmit="return handleTeacherRegister(event)">
                    <div class="mb-2">
                        <label class="form-label small fw-bold">아이디</label>
                        <input type="text" id="regTeacherId" class="form-control" required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label small fw-bold">비밀번호</label>
                        <input type="password" id="regTeacherPw" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">이름</label>
                        <input type="text" id="regTeacherName" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100 fw-bold">회원가입 완료</button>
                </form>
            </div>
        </div>
    </div>

    <!-- 2. 게시판 화면 (로그인 성공 시 표시) -->
    <div id="boardSection" class="container bg-white p-4 rounded shadow-sm d-none" style="max-width: 800px;">
        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
            <h3 class="fw-bold m-0">📌 우리반 학급 게시판</h3>
            <div>
                <span id="userInfo" class="badge bg-secondary me-2 p-2"></span>
                <button onclick="location.reload()" class="btn btn-outline-danger btn-sm">로그아웃</button>
            </div>
        </div>
        <div class="alert alert-success">
            게시판에 입장하셨습니다!
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function handleTeacherLogin(e) {
            e.preventDefault();
            const id = document.getElementById('teacherId').value;
            const pw = document.getElementById('teacherPw').value;

            fetch('/api/teacher/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, pw })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showBoard(data.name || id, '교사');
                } else {
                    alert(data.message || '로그인에 실패했습니다.');
                }
            })
            .catch(() => alert('서버통신 오류가 발생했습니다.'));
            return false;
        }

        function handleStudentLogin(e) {
            e.preventDefault();
            const name = document.getElementById('studentName').value;

            fetch('/api/student/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showBoard(name, '학생');
                }
            })
            .catch(() => alert('서버통신 오류가 발생했습니다.'));
            return false;
        }

        function handleTeacherRegister(e) {
            e.preventDefault();
            const id = document.getElementById('regTeacherId').value;
            const pw = document.getElementById('regTeacherPw').value;
            const name = document.getElementById('regTeacherName').value;

            fetch('/api/teacher/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, pw, name })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                if (data.success) {
                    const teacherTab = new bootstrap.Tab(document.getElementById('teacher-tab'));
                    teacherTab.show();
                }
            });
            return false;
        }

        function showBoard(userName, role) {
            document.getElementById('loginSection').classList.add('d-none');
            document.getElementById('boardSection').classList.remove('d-none');
            document.getElementById('userInfo').innerText = `${userName}님 (${role})`;
        }
    </script>
</body>
</html>
